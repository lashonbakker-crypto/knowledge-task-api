[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-task-api"
version = "0.2.0"
description = "A durable knowledge-indexing backend with tenant-scoped retrieval, idempotency and fenced workers."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3"]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<10"]

[project.scripts]
knowledge-task-api = "knowledge_task_api.__main__:main"

[tool.setuptools.packages.find]
include = ["knowledge_task_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
