name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.14"
          - os: windows-latest
            python: "3.12"
          - os: macos-15-intel
            python: "3.12"
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install tested dependency versions
        run: python -m pip install -c requirements.lock ".[test]"
      - name: Run behavior and fault tests
        run: python -m pytest
      - name: Run real HTTP demonstration
        run: python scripts/demo.py
      - name: Run deterministic heartbeat exercise
        run: python scripts/lease_demo.py
      - name: Run isolated read-only agent tool demonstration
        run: python scripts/agent_bridge_demo.py
      - name: Run deterministic processing-budget exercise
        run: python scripts/budget_demo.py
      - name: Run real HTTP capacity exercise
        run: python scripts/capacity_demo.py
